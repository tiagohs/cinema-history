name: Android Build & Release

on:
  # Execução manual pela aba "Actions" do GitHub (gera o draft release por padrão)
  workflow_dispatch:
    inputs:
      create_release:
        description: "Criar/atualizar draft release com APK e AAB"
        type: boolean
        default: true
      version_code:
        description: "Sobrescrever versionCode (opcional, deixe vazio para usar o do dependencies.gradle)"
        type: string
        required: false

  # Push de tag v* (ex.: v2.2.0) também gera o draft release
  push:
    tags:
      - "v*"
    branches:
      - master
      - "upgrade/**"
      - "feature/**"
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"

  pull_request:
    paths:
      - "android/**"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Configure local.properties for CI
        # O local.properties versionado aponta para o SDK do Mac; no runner usamos o SDK instalado acima.
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure signing (secrets, optional)
        # Se os secrets existirem, usa o keystore deles. Caso contrário, usa o keystore do repositório.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Usando keystore dos secrets"
          else
            echo "Secret ANDROID_KEYSTORE_BASE64 não definido: usando android/keystore/keystore.keystore"
          fi
          [ -n "$KEYSTORE_PASSWORD" ] && echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          [ -n "$KEY_ALIAS" ] && echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          [ -n "$KEY_PASSWORD" ] && echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          true

      - name: Read version
        id: version
        run: |
          NAME=$(grep -E "^\s*versionName\s*=" dependencies.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          CODE=$(grep -E "^\s*versionCode\s*=" dependencies.gradle | sed -E "s/[^0-9]*([0-9]+).*/\1/")
          if [ -n "${{ inputs.version_code }}" ]; then CODE="${{ inputs.version_code }}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versão: $NAME ($CODE)"

      - name: Validate content (assets/local)
        # Lê todos os JSONs com o mesmo Gson do app; falha se algum arquivo/tradução quebrar a estrutura.
        run: |
          chmod +x gradlew
          ./gradlew :domain:testDebugUnitTest :helpers:testDebugUnitTest --stacktrace

      - name: Upload content test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: content-test-report
          path: |
            android/domain/build/reports/tests/
            android/helpers/build/reports/tests/

      - name: Build release APK and AAB
        run: |
          chmod +x gradlew
          EXTRA=""
          if [ -n "${{ inputs.version_code }}" ]; then EXTRA="-PversionCodeOverride=${{ inputs.version_code }}"; fi
          ./gradlew assembleRelease bundleRelease --stacktrace $EXTRA

      - name: Collect binaries
        id: files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          BASE="cinema-history-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/dist/$BASE.apk"
          cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/dist/$BASE.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$GITHUB_WORKSPACE/dist/$BASE-mapping.txt" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinema-history-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: dist/*
          retention-days: 30

      - name: Create or update draft release
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.create_release) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ steps.version.outputs.name }}"
          fi

          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft)
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Já existe um release publicado com a tag $TAG. Aumente versionName/versionCode em android/dependencies.gradle."
              exit 1
            fi
            echo "Atualizando draft existente $TAG"
          else
            gh release create "$TAG" \
              --draft \
              --target "${{ github.sha }}" \
              --title "Cinema History $TAG (build ${{ steps.version.outputs.code }})" \
              --generate-notes
          fi

          gh release upload "$TAG" dist/* --clobber
          echo "Draft release: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
