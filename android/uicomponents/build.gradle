apply plugin: 'com.android.library'

android {
    def globalConfiguration = rootProject.extensions.getByName("ext")

    compileSdk globalConfiguration["compileSDK"]


    defaultConfig {
        minSdk globalConfiguration["minSDK"]


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        test.java.srcDir 'javatests'
        main {
            globalConfiguration["componentsSrcDirs"].forEach {
                res.srcDirs += 'src/main/java/' + it + '/res'
            }
            java.srcDir 'java'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    namespace 'com.tiagohs.uicomponents'

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(path: ':domain')
    implementation project(path: ':entities')
    implementation project(path: ':helpers')

    def dependencies = rootProject.ext.dependencies

    
    // Android Core / Material
    implementation dependencies.appcompat
    implementation dependencies.androidxCore
    implementation dependencies.constrantlayout
    implementation dependencies.browser
    implementation dependencies.androidMaterial


    implementation dependencies.glide
    implementation dependencies.glide_transformations

    // YoutubePlayer
    implementation dependencies.youtubePlayer

    // Test Tools
    testImplementation dependencies.junit
    androidTestImplementation dependencies.testRunner
    androidTestImplementation dependencies.espresso
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
