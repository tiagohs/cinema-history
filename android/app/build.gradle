apply plugin: 'com.android.application'

apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.gms.google-services'

apply plugin: 'com.google.firebase.crashlytics'

android {
    def globalConfiguration = rootProject.extensions.getByName("ext")

    compileSdk globalConfiguration["compileSDK"]

    signingConfigs {
        config {
            // No CI os valores vêm de secrets (variáveis de ambiente); localmente usa o keystore do projeto.
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'CineHistory'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: '14789632'
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: '../keystore/keystore.keystore')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: '14789632'
        }
    }

    defaultConfig {
        applicationId "com.tiagohs.cinema_history"

        minSdk globalConfiguration["minSDK"]
        targetSdk globalConfiguration["targetSDK"]

        // O CI pode sobrescrever o versionCode com -PversionCodeOverride=<n>
        versionCode = project.hasProperty('versionCodeOverride') ? project.property('versionCodeOverride').toInteger() : globalConfiguration["versionCode"]
        versionName = globalConfiguration["versionName"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "THEMOVIEDB_API_KEY", '"dac4d50f24dee29513738d8fa3470a3f"'
        buildConfigField "String", "OMDB_API_KEY", '"de9f93c2"'

        vectorDrawables.useSupportLibrary = true
    }


    buildTypes {
        release {
            // R8: remove código e recursos não usados, otimiza e ofusca.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.config
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    namespace 'com.tiagohs.cinema_history'

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Gera o locales_config a partir das pastas values-* (pt-BR, es, en-US padrão):
    // habilita o seletor de idioma do app no Android 13+.
    androidResources {
        generateLocaleConfig = true
        // Mantém só os idiomas do app (remove traduções de bibliotecas em outros idiomas).
        localeFilters += ["en", "es", "pt"]
    }
}

dependencies {
    implementation project(path: ':uicomponents')
    implementation project(path: ':domain')
    implementation project(path: ':data')
    implementation project(path: ':helpers')
    implementation project(path: ':entities')

    def dependencies = rootProject.ext.dependencies

    implementation platform(dependencies.firebaseBom)

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // Android Core / Material
    implementation dependencies.appcompat
    implementation dependencies.androidxCore
    implementation dependencies.constrantlayout
    implementation dependencies.androidMaterial
    implementation dependencies.browser

    // Components and Tools
    implementation dependencies.betterLinkMovement
    implementation dependencies.constrantlayout
    implementation dependencies.overflowPager
    implementation dependencies.imageViewer
    implementation dependencies.shimmer
    implementation dependencies.androidAboutPage
    implementation dependencies.simpleRatingBar
    implementation dependencies.flexbox
    implementation dependencies.indicator_fast_scroll

    // Tools
    implementation dependencies.gson
    implementation dependencies.timber
    implementation dependencies.javaxAnnotation

    // Glide
    implementation dependencies.glide
    implementation dependencies.glide_transformations

    // Firebase
    implementation dependencies.firebaseStorage
    implementation dependencies.firebaseAnalytics
    implementation dependencies.firebaseUiStorage
    implementation dependencies.firebaseCrashlytics

    // Preference
    implementation dependencies.preference
    implementation dependencies.preferenceKtx

    // Picasso

    // Dagger
    implementation dependencies.dagger
    ksp dependencies.daggerCompiler

    // Rx
    implementation dependencies.rxAndroid
    implementation dependencies.rxJava
    implementation dependencies.rxPreferences

    // Retrofit
    implementation dependencies.retrofit2
    implementation dependencies.retrofit2GsonConverter
    implementation dependencies.retrofit2RxJavaAdapter

    // Okhttp3
    implementation dependencies.okhttp3
    implementation dependencies.okhttp3LoggingInterceptor

    // Test Tools
    testImplementation dependencies.junit
    androidTestImplementation dependencies.testRunner
    androidTestImplementation dependencies.espresso
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
