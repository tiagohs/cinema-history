apply plugin: 'com.android.library'
apply plugin: 'com.google.devtools.ksp'

android {
    def globalConfiguration = rootProject.extensions.getByName("ext")

    compileSdk globalConfiguration["compileSDK"]

    defaultConfig {
        minSdk globalConfiguration["minSDK"]


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    namespace 'com.tiagohs.domain'

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(path: ':data')
    implementation project(path: ':helpers')
    implementation project(path: ':entities')

    def dependencies = rootProject.ext.dependencies

    implementation platform(dependencies.firebaseBom)

        implementation dependencies.androidMaterial

    // Tools
    implementation dependencies.gson
    implementation dependencies.timber
    implementation dependencies.javaxAnnotation
    implementation dependencies.glide_transformations

    // Rx
    implementation dependencies.rxAndroid
    implementation dependencies.rxJava
    implementation dependencies.rxPreferences

    // Firebase
    implementation dependencies.firebaseAnalytics

    // Dagger
    implementation dependencies.dagger
    ksp dependencies.daggerCompiler

    // Retrofit
    implementation dependencies.retrofit2
    implementation dependencies.retrofit2GsonConverter
    implementation dependencies.retrofit2RxJavaAdapter

    // Testes (LocalContentTest valida assets/local)
    testImplementation dependencies.junit

    // Okhttp3
    implementation dependencies.okhttp3
    implementation dependencies.okhttp3LoggingInterceptor
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// O LocalContentTest lê assets/local do app: declara como entrada para o teste rodar de novo quando o conteúdo mudar.
tasks.withType(Test).configureEach {
    inputs.dir("${rootProject.projectDir}/app/src/main/assets/local")
        .withPropertyName("localContent")
        .withPathSensitivity(PathSensitivity.RELATIVE)
}
