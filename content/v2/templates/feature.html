<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Feature graphic</title>
<link rel="stylesheet" href="base.css">
<style>
  /* 1024x500. Regras da Play: sem aparelho, sem selo, foco no centro, bordas só com fundo,
     evitar fundo preto puro (usamos marrom/vinho escuro). */
  .canvas { width: 1024px; height: 500px; background:
    radial-gradient(70% 90% at 50% -10%, rgba(226,182,91,.30) 0%, rgba(226,182,91,.06) 45%, transparent 70%),
    radial-gradient(60% 80% at 0% 100%, rgba(120,32,24,.55), transparent 70%),
    radial-gradient(60% 80% at 100% 100%, rgba(120,32,24,.55), transparent 70%),
    linear-gradient(180deg, #24170f 0%, #170f0a 60%, #1d110c 100%); }
  .beam { width: 140%; height: 140%; filter: blur(14px); }

  .center { position: absolute; left: 0; right: 0; top: 70px; text-align: center; z-index: 3; }
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; font-family: "Oswald"; font-weight: 400; font-size: 22px;
    letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
  .eyebrow::before, .eyebrow::after { content: ""; width: 46px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .eyebrow::after { transform: scaleX(-1); }
  .title { margin-top: 6px; font-family: "Oswald"; font-weight: 700; font-size: 104px; line-height: 1.02; text-transform: uppercase;
    letter-spacing: .01em; color: var(--ink); text-shadow: 0 8px 40px rgba(0,0,0,.6); white-space: nowrap; }
  .title em { font-style: normal; }

  /* faixa de película com os anos de início de cada era */
  .strip { position: absolute; left: -40px; right: -40px; top: 330px; height: 118px; z-index: 2; transform: rotate(-2.2deg);
    background: #0d0907; box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(226,182,91,.18);
    display: flex; flex-direction: column; justify-content: space-between; padding: 8px 0; }
  .holes { height: 12px; margin: 0 6px; background: repeating-linear-gradient(90deg, rgba(246,240,230,.85) 0 14px, transparent 14px 30px);
    border-radius: 2px; opacity: .5; }
  .frames { display: flex; justify-content: center; gap: 8px; }
  .frame { width: 100px; height: 66px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-family: "Oswald"; font-weight: 700; font-size: 34px; letter-spacing: .02em;
    background: linear-gradient(180deg, #2a1d13, #1a120c); box-shadow: inset 0 0 0 1px rgba(226,182,91,.22); color: var(--muted); }
  .frame.on { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 60%, var(--gold-lo)); color: #1a120c; }
</style>
</head>
<body>
<div class="canvas" id="c">
  <div class="beam"></div>
  <div class="center">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="title" id="title"></div>
  </div>
  <div class="strip">
    <div class="holes"></div>
    <div class="frames" id="frames"></div>
    <div class="holes"></div>
  </div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>
<script>
const CFG = window.CFG;   // {eyebrow, title, years:[...], highlight:[...]}
const esc = s => s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
document.getElementById('eyebrow').textContent = CFG.eyebrow;
const t = document.getElementById('title');
t.innerHTML = esc(CFG.title).replace(/\*(.+?)\*/g, '<em class="gold-text">$1</em>');
const fr = document.getElementById('frames');
CFG.years.forEach(y => {
  const d = document.createElement('div');
  d.className = 'frame' + ((CFG.highlight || []).includes(y) ? ' on' : '');
  d.textContent = y;
  fr.appendChild(d);
});
(async () => {
  await document.fonts.ready;
  let s = 104;
  while (s > 60 && t.scrollWidth > 900) { s -= 2; t.style.fontSize = s + 'px'; }
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
